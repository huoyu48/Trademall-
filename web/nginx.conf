server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite 的资源文件名带内容哈希，可以长期缓存；入口页不能缓存，
    # 否则发布新版本后旧入口会继续请求已经不存在的旧资源文件。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # SPA 路由回退，保证刷新 / 直接访问子路由不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端 API（docker compose 网络内服务名为 backend，容器端口 8080）
    # 注意 proxy_pass 不带 URI，原请求路径（含 /api 前缀）原样透传给后端
    location /api/ {
        proxy_pass http://backend:8080;
        # WebSocket 升级：顾客/商家实时咨询使用 /api/ws/chat。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

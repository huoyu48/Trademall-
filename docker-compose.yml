services:
  mysql:
    image: mysql:8.4
    container_name: orderflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orderflow
      MYSQL_USER: orderflow
      MYSQL_PASSWORD: orderflow
    ports:
      - "13306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uorderflow", "-porderflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - orderflow-mysql-data-v2:/var/lib/mysql

  redis:
    image: redis:7
    container_name: orderflow-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: orderflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: orderflow
      RABBITMQ_DEFAULT_PASS: orderflow
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: orderflow-backend:latest
    container_name: orderflow-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/orderflow?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: "orderflow"
      SPRING_DATASOURCE_PASSWORD: "orderflow"
      SPRING_REDIS_HOST: "redis"
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_PASSWORD: "orderflow"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: "orderflow"
      SPRING_RABBITMQ_PASSWORD: "orderflow"
      SPRING_RABBITMQ_VIRTUAL_HOST: "/"
      ORDERFLOW_ALIPAY_ENABLED: "${ORDERFLOW_ALIPAY_ENABLED:-false}"
      ORDERFLOW_ALIPAY_APP_ID: "${ORDERFLOW_ALIPAY_APP_ID:-9021000167606334}"
      ORDERFLOW_ALIPAY_GATEWAY_URL: "${ORDERFLOW_ALIPAY_GATEWAY_URL:-https://openapi-sandbox.dl.alipaydev.com/gateway.do}"
      ORDERFLOW_ALIPAY_APP_PRIVATE_KEY: "${ORDERFLOW_ALIPAY_APP_PRIVATE_KEY:-}"
      ORDERFLOW_ALIPAY_PUBLIC_KEY: "${ORDERFLOW_ALIPAY_PUBLIC_KEY:-}"
      ORDERFLOW_ALIPAY_NOTIFY_URL: "${ORDERFLOW_ALIPAY_NOTIFY_URL:-}"
      ORDERFLOW_ALIPAY_RETURN_URL: "${ORDERFLOW_ALIPAY_RETURN_URL:-http://localhost:8088/#/shop/orders}"
      # 限制容器内 JVM 堆内存，避免后端吃满宿主机资源/持续发热
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    mem_limit: 512m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: orderflow-frontend:latest
    container_name: orderflow-frontend
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - backend

volumes:
  orderflow-mysql-data-v2:

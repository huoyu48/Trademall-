server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: orderflow
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/orderflow?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: orderflow
    password: orderflow
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  redis:
    host: 127.0.0.1
    port: 16379
    password: orderflow
    database: 0
    timeout: 3000ms
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: orderflow
    password: orderflow
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    # 注意：项目显式声明了 rabbitListenerContainerFactory Bean，
    # 因此 spring.rabbitmq.listener.simple.* 不会生效（@ConditionalOnMissingBean）。
    # ack 模式 / 重试次数 / requeue 策略统一在 RabbitMQConfig 中配置，避免两处配置互相打脸。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.orderflow.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    # 走 slf4j 而非 StdOutImpl：StdOutImpl 会把每条 SQL 直接打到 stdout 且无法按级别关闭，
    # 一旦出现消费重试风暴日志会瞬间涨到几百 MB。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
orderflow:
  jwt:
    secret: "orderflow-default-secret-change-me-in-prod-0123456789abcdef"
    expiration-minutes: 720
  security:
    permit-all: "/api/auth/login,/api/platform/auth/login,/api/customer/auth/login,/api/customer/auth/register,/api/actuator/**,/api/health"
  customer:
    # 顾客在注册前没有租户上下文，统一归入商城默认租户；不能由前端指定。
    default-tenant-code: t-a
  order:
    timeout-minutes: 30
  inventory:
    low-stock-threshold: 10
  outbox:
    batch-size: 100
    publish-interval-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: info
    com.orderflow: info
    # 需要排查 SQL 时临时调成 debug，默认关闭避免日志膨胀
    com.orderflow.domain.mapper: info
